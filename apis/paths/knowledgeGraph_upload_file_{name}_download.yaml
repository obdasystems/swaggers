get:
  tags: [Upload]
  summary: Download an uploaded RDF file
  operationId: getKnowledgeGraphUploadFileDownload
  parameters:
    - name: name
      in: path
      required: true
      schema: { type: string }
    - name: iri
      in: query
      required: true
      schema: { type: string }
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema: { $ref: ../components/schemas/FileInfo.yaml }
    "401": { description: Unhauthorized }
