get:
  tags: [NodeSettings]
  summary: Returns the default VKG node settings for the ontology version
  operationId: getDefaultNodeSettings
  parameters:
  - name: name
    in: path
    required: true
    schema: {type: string}
  - name: version
    in: query
    required: true
    schema: {type: string}
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema: {$ref: ../components/schemas/NodeSettingsMap.yaml}
    '401': {description: Unhauthorized}
