post:
  tags: [APISemantiche]
  summary: Takes a JSON file containing the specification of a service, plus the list of semantic annotations for every schema component being annotated, and returns the JSON specification decorated with such annotations
  operationId: postApisemSchema
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/FileInfoAndSemanticAnnotations.yaml
  responses:
    "200":
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FileInfo.yaml
    "401": { description: Unhauthorized }