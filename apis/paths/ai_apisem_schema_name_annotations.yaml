get:
  tags: [APISemantiche]
  summary: Takes as input the name of a schema component (as a path parameter) and the name of a similar class previously identified by the operator (as a query parameter) and returns the full set of semantic annotations for the given schema component w.r.t. to the similar class provided
  operationId: postApisemSchemaNameAnnotations
  parameters:
    - name: name
      in: path
      required: true
      description: the name of the schema component
      schema:
        type: string
    - name: similarClass
      in: query
      required: true
      description: the value of the similar class identified by the operator
      schema:
        type: string
  responses:
    "200":
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SemanticAnnotations.yaml
    "401": { description: Unhauthorized }