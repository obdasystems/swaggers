title: OntologyEntity
type: object
required: [entityIRI]
properties:
  entityLabels:
    type: array
    items: { $ref: ./Label.yaml }
  deprecated: { type: boolean, default: false }
  entityIRI: { type: string }
  entityType: { type: string }
  entityPrefixIRI: { type: string }
  entityRemainder: { type: string }
  entityID: { type: string }
  entityTagId:
    type: string
    description: The ID of the ontology entity tag associated with the entity
  defined: 
    type: boolean
    default: false
    description: Indicates whether the entity is defined in the ontology (true) or is a reference to an external entity (false)