title: AiInfo
type: object
properties:
  version:
    type: string
    description: The version of the AI service.
  usage:
    type: object
    properties: 
      inputTokens:
        type: integer
        description: The number of input tokens used by the AI service.
      outputTokens:
        type: integer
        description: The number of output tokens generated by the AI service.
  noAuth:
    type: boolean
    description: Indicates whether the AI service requires authentication.
  llmModel:
    type: string
    description: The language model used by the AI service.
  embeddingModel:
    type: string
    description: The embedding model used by the AI service.
  
