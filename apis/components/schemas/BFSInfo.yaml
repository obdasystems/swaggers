title: BFSInfo
description: It represents the state of the BFS
type: object
properties:
  status:
    $ref: IMwsxThreadState.yaml
  percentage:
    type: integer
    default: 0
  startTime:
    type: integer
    default: 0
    format: int64
  endTime:
    type: integer
    default: 0
    format: int64
  currentPath:
    $ref: BFSPath.yaml
  foundPaths:
    type: array
    items: 
      $ref: BFSPath.yaml
  rejectedPaths:
    type: array
    items: 
      $ref: BFSPath.yaml